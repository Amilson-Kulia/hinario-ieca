    - assets/dados/hinos_umbundo.json
    - assets/dados/hinos_kimbundo.json
    - assets/dados/hinos_nganguela.json
    - assets/dados/invocatorias_umbundo.json
    - assets/dados/invocatorias_nganguela.json
    - assets/dados/litanias_umbundo.json
    - assets/dados/litanias_kimbundo.json
    - assets/dados/litanias_nganguela.json
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Italic.ttf
    - assets/dados/historia_ieca.json

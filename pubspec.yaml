name: hinario_ieca
description: "Aplicativo IECA."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Armazenamento local
  shared_preferences: ^2.5.3
  share_plus: ^11.0.0

  # Abertura de fontes externas
  url_launcher: ^6.3.2

  pdf: ^3.11.3
  printing: ^5.14.2

  # Notificações locais
  flutter_local_notifications: ^22.3.0

  # Fuso horário utilizado pelas notificações
  timezone: ^0.11.1

  # Obtém o fuso horário do dispositivo
  flutter_timezone: ^5.1.0

  # Ícones Cupertino
  cupertino_icons: ^1.0.8

  xml: ^6.6.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Regras de qualidade do código
  flutter_lints: ^6.0.0

  # Ícones do aplicativo
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logoieca.png
    - assets/images/icone.png
    - assets/images/criador.png
    - assets/dados/categorias_hinos.json
    - assets/dados/invocatorias.json
